name: Showcase
run-name: Deploy showcase ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Release tag to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          git rev-parse --verify "refs/tags/$TAG^{commit}"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Install dependencies
        run: make ci.install

      - name: Build VitePress showcase
        run: make local showcase.build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload VitePress site
        uses: actions/upload-pages-artifact@v5
        with:
          path: showcase/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy VitePress site
        id: deployment
        uses: actions/deploy-pages@v5
